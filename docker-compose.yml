# AV1 Video Encoder Pro - Docker Compose Configuration
#
# Usage:
#   Start CLI mode:     docker compose run --rm encoder --help
#   Encode a video:     docker compose run --rm encoder -i /videos/input.mp4 -o /output/output.webm -q 50
#   Start Web UI:       docker compose up web
#   Start GUI (Linux):  docker compose up gui
#
# Prerequisites for GUI mode on Linux:
#   xhost +local:docker

services:
  # CLI Mode - Headless encoding
  encoder:
    build:
      context: .
      dockerfile: Dockerfile
    image: av1-encoder-pro:latest
    container_name: av1-encoder-cli
    volumes:
      # Mount your video directories
      - ./videos:/videos:ro # Input videos (read-only)
      - ./output:/output # Output directory
      # Or use absolute paths:
      # - /path/to/your/videos:/videos:ro
      # - /path/to/output:/output
    environment:
      - PYTHONIOENCODING=utf-8
    working_dir: /app
    # Default: show help
    command: [ "--help" ]

  # Batch encoding service
  batch:
    build:
      context: .
      dockerfile: Dockerfile
    image: av1-encoder-pro:latest
    container_name: av1-encoder-batch
    volumes:
      - ./videos:/videos:ro
      - ./output:/output
    environment:
      - PYTHONIOENCODING=utf-8
    working_dir: /app
    # Override to run batch encoding (must use bash for brace expansion)
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        echo "=== AV1 Batch Encoder ==="
        echo "Encoding all videos in /videos to /output..."
        shopt -s nullglob
        succeeded=0
        failed=0
        for f in /videos/*.{mp4,mkv,avi,mov,webm,MP4,MKV,AVI,MOV,WEBM}; do
          if [ -f "$$f" ]; then
            filename=$$(basename "$$f")
            name="$${filename%.*}"
            ext="$${filename##*.}"
            out="/output/$${name}_av1.webm"
            # Prevent stem collisions across different source extensions
            if [ -f "$$out" ]; then
              out="/output/$${name}_$${ext}_av1.webm"
            fi
            echo "Encoding: $$filename -> $$(basename "$$out")"
            if python /app/encode_cli.py -i "$$f" -o "$$out" -q 50 -p 6; then
              succeeded=$$((succeeded + 1))
            else
              echo "FAILED: $$filename" >&2
              failed=$$((failed + 1))
            fi
          fi
        done
        echo "=== Batch complete: $$succeeded succeeded, $$failed failed ==="
        if [ "$$failed" -gt 0 ]; then
          exit 1
        fi

  # Web UI Mode (Browser access - works on all platforms)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: av1-encoder-pro:latest
    container_name: av1-encoder-web
    volumes:
      - ./videos:/videos
      - ./output:/output
    environment:
      - PYTHONIOENCODING=utf-8
      - HOST=0.0.0.0
      - PORT=2081
    working_dir: /app
    # Run the Web UI application
    entrypoint: [ "python", "web_ui.py" ]
    ports:
      # Bound to localhost for security; change to "2081:2081" or "0.0.0.0:2081:2081" for LAN access
      - "127.0.0.1:2081:2081"
    restart: unless-stopped

  # GUI Mode (Linux with X11) - Desktop GUI, not for browser
  gui:
    build:
      context: .
      dockerfile: Dockerfile
    image: av1-encoder-pro:latest
    container_name: av1-encoder-gui
    volumes:
      - ./videos:/videos
      - ./output:/output
      # X11 socket for GUI display (Linux)
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - PYTHONIOENCODING=utf-8
      # For Wayland (uncomment if needed)
      # - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      # - XDG_RUNTIME_DIR=/tmp
    working_dir: /app
    # Run the GUI application
    entrypoint: [ "python", "av1_encoder_ctk.py" ]
